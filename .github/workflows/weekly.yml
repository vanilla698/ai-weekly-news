name: Weekly AI Auto News Push

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

permissions: write-all   # ← 加这一行，赋予 Actions 写权限

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate news HTML
        run: python3 generate_news.py

      - name: Commit generated HTML
        run: |
          git config user.name "Mavis Bot"
          git config user.email "mavis@ai-weekly-news"
          git add ai_auto_news_preview.html || true
          git commit -m "📡 $(date '+%Y-%m-%d %H:%M') 自动更新情报" || echo "No changes to commit"
          git push || echo "Push skipped"

      - name: Send DingTalk notification
        run: python3 upload_and_push.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          GH_TOKEN: ${{ github.token }}   
