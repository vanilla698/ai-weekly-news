name: Weekly AI Auto News Push

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate news HTML
        run: python3 generate_news.py

      - name: Commit generated HTML
        run: |
          git config user.name "Mavis Bot"
          git config user.email "mavis@ai-weekly-news"
          git add news/ || true
          git add news_data.json || true
          git commit -m "📡 $(date '+%Y-%m-%d %H:%M') 自动更新" || echo "no changes"
          git push || echo "push skipped"

      - name: Push to DingTalk
        run: python3 upload_and_push.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
