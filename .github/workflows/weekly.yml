name: Weekly AI Auto News Push

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          node-version: "24"   # ← 加这行

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Generate news HTML
        run: python3 generate_news.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit generated files
        run: |
          git config user.name "Mavis Bot"
          git config user.email "mavis@ai-weekly-news"
          git add news/ || true
          git add news_data.json || true
          git commit -m "📡 $(date '+%Y-%m-%d %H:%M') 自动更新" || echo "no changes"
          git push || echo "push skipped"

      - name: Push to DingTalk
        run: python3 upload_and_push.py
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}

